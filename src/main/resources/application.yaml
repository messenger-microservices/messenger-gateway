spring:
  profiles:
    default: dev
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-route
              uri: http://localhost:8001
              predicates:
                - Path=/api/v1/users/**
            - id: auth-service-route
              uri: http://localhost:8002
              predicates:
                - Path=/api/v1/auth/**
            - id: message-service-route
              uri: http://localhost:8004
              order: 1
              predicates:
                - Path=/api/v1/messages/**
                - Path=/api/v1/chats/{chatId}/messages/**
            - id: chat-service-route
              uri: http://localhost:8003
              order: 2
              predicates:
                - Path=/api/v1/chats/**

server:
  port: 8000
